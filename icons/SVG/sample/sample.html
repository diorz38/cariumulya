<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG mask samples</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; display: flex; gap: 48px; padding: 48px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; text-align: center; }
  .photo { width: 400px; height: auto; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .shape-1 .photo { -webkit-mask-image: url(mask-1.svg); mask-image: url(mask-1.svg); }
  .shape-2 .photo { width: 340px; -webkit-mask-image: url(mask-2.svg); mask-image: url(mask-2.svg); }
  .shape-3 .photo { width: 300px; -webkit-mask-image: url(mask-3.svg); mask-image: url(mask-3.svg); }
</style>
</head>
<body>
  <figure class="shape-1">
    <img class="photo" src="../../../gambar/assets_1.png" alt="masked 1">
    <figcaption>Asset 1</figcaption>
  </figure>
  <figure class="shape-2">
    <img class="photo" src="../../../gambar/assets_2.png" alt="masked 2">
    <figcaption>Asset 2</figcaption>
  </figure>
  <figure class="shape-3">
    <img class="photo" src="../../../gambar/assets_3.png" alt="masked 3">
    <figcaption>Asset 3</figcaption>
  </figure>

  <figure>
    <img src="Asset-1-sample.svg" alt="sample 1" width="400">

  <figure>
    <img src="Asset-2-sample.svg" alt="sample 2" width="340">
    <figcaption>Asset 2</figcaption>
  </figure>
  <figure>
    <img src="Asset-3-sample.svg" alt="sample 3" width="360">
    <figcaption>Asset 3</figcaption>
  </figure>

</html>
