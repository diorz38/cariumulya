<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleNatNight descNatNight">
  <title id="titleNatNight">Ilustrasi Malam 3D Pertanian Padi Sawah di Jawa Indonesia</title>
  <desc id="descNatNight">Pemandangan malam isometrik terasering sawah berundak dengan pantulan sinar rembulan di air sawah, cahaya lentera di saung bambu, dan kunang-kunang.</desc>
  <defs>
    <!-- Night Island Gradients -->
    <linearGradient id="islandTopNatNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#064e3b"/>
      <stop offset=".5" stop-color="#062e24"/>
      <stop offset="1" stop-color="#021f18"/>
    </linearGradient>
    <linearGradient id="islandSideNatNight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#022c22"/>
      <stop offset="1" stop-color="#01140f"/>
    </linearGradient>

    <!-- Night Moonlit Water -->
    <linearGradient id="waterGradNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0284c7"/>
      <stop offset=".4" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="waterReflectNight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bae6fd" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity=".1"/>
    </linearGradient>

    <!-- Terraces & Soil in Nocturnal Light -->
    <linearGradient id="soilBorderNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2d1e16"/>
      <stop offset=".5" stop-color="#1c120d"/>
      <stop offset="1" stop-color="#0f0907"/>
    </linearGradient>
    <linearGradient id="soilTopNight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3d2a1f"/>
      <stop offset="1" stop-color="#1f140e"/>
    </linearGradient>

    <linearGradient id="ripePaddyNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#854d0e"/>
      <stop offset=".6" stop-color="#713f12"/>
      <stop offset="1" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="greenPaddyNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#047857"/>
      <stop offset=".6" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>

    <!-- Lantern Glow Filter -->
    <filter id="lanternGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fireflyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="lampRadial" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ffedd5"/>
      <stop offset=".3" stop-color="#f59e0b" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#ea580c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="805" cy="897" rx="650" ry="140" fill="#01120b" opacity=".5" filter="url(#lanternGlow)"/>

  <!-- BASE ISOMETRIC ISLAND (Night Substratum) -->
  <path d="M92 680 795 318 1510 700 803 1058 92 680Z" fill="url(#islandSideNatNight)"/>
  <path d="M92 680 803 1058 1510 700 1494 682 803 1025 108 666Z" fill="#010e08"/>
  <path d="M92 662 795 300 1510 682 803 1040 92 662Z" fill="url(#islandTopNatNight)"/>

  <!-- ========================================== -->
  <!-- STEPPED RICE TERRACES (Night Mood)        -->
  <!-- ========================================== -->

  <!-- Top Terrace -->
  <path d="M220 540 620 350 780 430 400 620Z" fill="url(#soilBorderNight)"/>
  <path d="M230 535 615 355 770 430 395 610Z" fill="url(#greenPaddyNight)"/>
  <polygon points="260,520 580,370 730,435 410,580" fill="url(#waterReflectNight)"/>

  <!-- Mid Terrace 1 with Muted Harvest Rice -->
  <path d="M280 620 740 400 950 500 500 720Z" fill="url(#soilBorderNight)"/>
  <path d="M290 615 735 405 940 500 495 710Z" fill="url(#ripePaddyNight)"/>

  <!-- Mid Terrace 2 with Moonlit Water Mirror -->
  <path d="M720 440 1200 450 1420 570 940 560Z" fill="url(#soilBorderNight)"/>
  <path d="M730 435 1190 445 1410 565 945 555Z" fill="url(#waterGradNight)"/>
  <polygon points="750,440 1160,450 1370,555 960,545" fill="url(#waterReflectNight)"/>
  <!-- Moon glimmer specular streaks on water -->
  <line x1="880" y1="480" x2="1020" y2="482" stroke="#bae6fd" stroke-width="2" opacity=".7"/>
  <line x1="940" y1="510" x2="1140" y2="512" stroke="#bae6fd" stroke-width="2.5" opacity=".8"/>
  <line x1="1100" y1="535" x2="1280" y2="538" stroke="#bae6fd" stroke-width="2" opacity=".6"/>

  <!-- Lower Main Terrace -->
  <path d="M380 720 950 490 1460 710 820 990Z" fill="url(#soilBorderNight)"/>
  <path d="M390 715 945 495 1450 705 820 980Z" fill="url(#ripePaddyNight)"/>

  <!-- Earthen Ridges (Pematang Sawah) -->
  <path d="M390 715 Q600 600 945 495" stroke="url(#soilTopNight)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M500 720 Q800 680 1450 705" stroke="url(#soilTopNight)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M945 495 Q1150 590 1450 705" stroke="url(#soilTopNight)" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Night Irrigation Ditch with Moon Glow -->
  <path d="M620 350 Q660 520 640 680 T780 940" stroke="url(#waterGradNight)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M640 580 Q645 620 660 670" stroke="#7dd3fc" stroke-width="2" fill="none" opacity=".5"/>

  <!-- ========================================== -->
  <!-- BAMBOO SAUNG WITH GLOWING LANTERN         -->
  <!-- ========================================== -->
  <g id="saungSawahNight">
    <!-- Stilts -->
    <rect x="440" y="660" width="8" height="50" rx="3" fill="#451a03"/>
    <rect x="520" y="620" width="8" height="50" rx="3" fill="#2d1102"/>
    <rect x="470" y="690" width="8" height="50" rx="3" fill="#451a03"/>
    <rect x="550" y="650" width="8" height="50" rx="3" fill="#2d1102"/>

    <!-- Deck -->
    <polygon points="430,665 520,625 565,650 465,695" fill="#78350f"/>

    <!-- Lantern Glow Radius -->
    <circle cx="495" cy="625" r="70" fill="url(#lampRadial)" filter="url(#lanternGlow)"/>

    <!-- Roof Posts -->
    <line x1="445" y1="660" x2="445" y2="600" stroke="#78350f" stroke-width="5"/>
    <line x1="515" y1="620" x2="515" y2="570" stroke="#451a03" stroke-width="5"/>
    <line x1="475" y1="690" x2="475" y2="620" stroke="#78350f" stroke-width="5"/>
    <line x1="555" y1="645" x2="555" y2="585" stroke="#451a03" stroke-width="5"/>

    <!-- Thatched Roof (Night Silhouette with warm underside glow) -->
    <polygon points="495,540 405,620 495,640" fill="#451a03"/>
    <polygon points="495,540 495,640 585,585" fill="#2d1102"/>
    <polygon points="495,540 585,585 530,555" fill="#1c0b02"/>

    <!-- Hanging Petromax Lantern inside Saung -->
    <line x1="495" y1="590" x2="495" y2="615" stroke="#78350f" stroke-width="2"/>
    <circle cx="495" cy="622" r="5" fill="#fef08a" filter="url(#fireflyGlow)"/>
    <rect x="492" y="618" width="6" height="8" rx="2" fill="#f59e0b" opacity=".9"/>
  </g>

  <!-- ========================================== -->
  <!-- LUMBUNG PADI (Night Mood)                  -->
  <!-- ========================================== -->
  <g id="lumbungNight">
    <ellipse cx="1060" cy="450" rx="8" ry="4" fill="#334155"/>
    <ellipse cx="1120" cy="415" rx="8" ry="4" fill="#1e293b"/>
    <ellipse cx="1090" cy="475" rx="8" ry="4" fill="#334155"/>
    <ellipse cx="1150" cy="435" rx="8" ry="4" fill="#1e293b"/>

    <polygon points="1045,430 1080,455 1080,405 1030,370" fill="#451a03"/>
    <polygon points="1080,455 1160,420 1175,355 1080,405" fill="#271002"/>

    <path d="M990 350 Q1100 375 1220 330 L1105 280 Z" fill="#1c0b02"/>
    <!-- Small security lantern at the lumbung porch -->
    <circle cx="1080" cy="425" r="4" fill="#fef08a" filter="url(#fireflyGlow)"/>
  </g>

  <!-- ========================================== -->
  <!-- NIGHT FLORA & FIREFLIES (Kunang-Kunang)    -->
  <!-- ========================================== -->
  <!-- Coconut Silhouette Left -->
  <g id="kelapaNight1" transform="translate(180, 420)">
    <path d="M40 180 Q25 90 60 10" stroke="#1c120d" stroke-width="9" fill="none"/>
    <g stroke="#064e3b" stroke-width="6" fill="none" opacity=".8">
      <path d="M60 10 Q20 -20 -40 -10"/>
      <path d="M60 10 Q50 -50 10 -70"/>
      <path d="M60 10 Q100 -50 140 -40"/>
      <path d="M60 10 Q120 -10 160 20"/>
    </g>
  </g>

  <!-- Glowing Fireflies floating over paddy terraces -->
  <g fill="#bef264" filter="url(#fireflyGlow)">
    <circle cx="340" cy="580" r="3.5" opacity=".9"/>
    <circle cx="420" cy="540" r="2.5" opacity=".8"/>
    <circle cx="680" cy="620" r="4" opacity=".95"/>
    <circle cx="720" cy="560" r="3" opacity=".7"/>
    <circle cx="820" cy="680" r="4" opacity=".9"/>
    <circle cx="890" cy="640" r="2.5" opacity=".85"/>
    <circle cx="980" cy="740" r="3.5" opacity=".9"/>
    <circle cx="1060" cy="660" r="3" opacity=".75"/>
    <circle cx="1180" cy="690" r="4" opacity=".9"/>
    <circle cx="1250" cy="610" r="2.5" opacity=".8"/>
    <circle cx="600" cy="760" r="3.5" opacity=".9"/>
    <circle cx="760" cy="840" r="3" opacity=".85"/>
  </g>
</svg>
