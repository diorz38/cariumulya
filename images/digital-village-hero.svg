<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Lapisan foreground ilustrasi digital desa</title>
  <desc id="desc">Objek desa digital tiga dimensi dengan balai desa sebagai fokus utama, bangunan civic berlapis, jalan, lanskap, dan simpul data dalam warna biru.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#dff3ff"/>
      <stop offset=".48" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#bae6fd" stop-opacity=".38"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="islandTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c9eadc"/>
      <stop offset=".55" stop-color="#a9d9c6"/>
      <stop offset="1" stop-color="#86c6b1"/>
    </linearGradient>
    <linearGradient id="islandSide" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#69a996"/>
      <stop offset="1" stop-color="#3f7f72"/>
    </linearGradient>
    <linearGradient id="hallFront" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#c8e4fa"/>
    </linearGradient>
    <linearGradient id="hallSide" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9ecbe8"/>
      <stop offset="1" stop-color="#578eb8"/>
    </linearGradient>
    <linearGradient id="roofA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#164e9b"/>
      <stop offset=".52" stop-color="#2563c7"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="roofB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e0f2fe"/>
      <stop offset=".55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef4f8"/>
      <stop offset="1" stop-color="#cddbe5"/>
    </linearGradient>
    <linearGradient id="plaza" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#cfe1ee"/>
    </linearGradient>
    <radialGradient id="nodeCore">
      <stop stop-color="#fff"/>
      <stop offset=".34" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-50%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="buildingShadow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="fieldLines" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0V22" stroke="#5ca990" stroke-width="2" opacity=".28"/>
    </pattern>
  </defs>

