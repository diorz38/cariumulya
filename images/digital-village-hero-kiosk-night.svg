<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleKioskNight descKioskNight">
  <title id="titleKioskNight">Ilustrasi Malam 3D Gedung Pusat Pelayanan Publik Digital Desa (Open-Roof)</title>
  <desc id="descKioskNight">Pemandangan malam isometrik arsitektur terbuka gedung pelayanan digital desa dengan pendaran neon biru cyan, layar sentuh interaktif yang menyala, loket bersinar hangat, dan antrean digital cerdas.</desc>
  <defs>
    <!-- Night Island Base -->
    <linearGradient id="islandTopKioskNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset=".5" stop-color="#090d16"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="islandSideKioskNight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#090d16"/>
      <stop offset="1" stop-color="#010307"/>
    </linearGradient>

    <!-- Glowing Screen & Neon Gradients -->
    <linearGradient id="touchScreenNight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset=".6" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="interiorWarmNight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fef08a" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#f59e0b" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity=".4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlowKiosk" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="signGlowNight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="805" cy="897" rx="650" ry="140" fill="#020617" opacity=".6" filter="url(#neonGlowKiosk)"/>

  <!-- BASE ISOMETRIC ISLAND -->
  <path d="M92 680 795 318 1510 700 803 1058 92 680Z" fill="url(#islandSideKioskNight)"/>
  <path d="M92 680 803 1058 1510 700 1494 682 803 1025 108 666Z" fill="#010307"/>
  <path d="M92 662 795 300 1510 682 803 1040 92 662Z" fill="url(#islandTopKioskNight)"/>

  <!-- Luminous Cyan Data Pathways across Ground -->
  <path d="M260 670 L640 860 L1200 680 L820 490 Z" stroke="#38bdf8" stroke-width="3" fill="none" opacity=".8" filter="url(#neonGlowKiosk)"/>
  <path d="M420 750 L640 860 L920 810" stroke="#0ea5e9" stroke-width="3.5" fill="none" opacity=".9"/>
  <circle cx="640" cy="860" r="7" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>
  <circle cx="1200" cy="680" r="7" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>

  <!-- ====================================================================== -->
  <!-- OPEN-ROOF DIGITAL CENTER AT NIGHT (Open-Plan Floor View)               -->
  <!-- ====================================================================== -->
  <g id="gedungPelayananNightOpenRoof">
    <!-- Base Plinth -->
    <polygon points="380,660 820,430 1280,660 820,890" fill="#1e293b"/>
    <polygon points="380,660 820,890 820,910 380,680" fill="#0f172a"/>
    <polygon points="820,890 1280,660 1280,680 820,910" fill="#020617"/>

    <!-- Open Interior Floor (Night Slate Floor with Ambient Glow) -->
    <polygon points="400,650 820,440 1260,650 820,860" fill="#0f172a"/>
    <line x1="500" y1="600" x2="920" y2="810" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="600" y1="550" x2="1020" y2="760" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="700" y1="500" x2="1120" y2="710" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Left Back Wall with Wall Cap -->
    <polygon points="400,650 820,440 820,290 400,500" fill="#0f172a"/>
    <polygon points="400,500 820,290 832,296 412,506" fill="#1e293b"/>
    <!-- Cyan Outline on Top Wall Edge -->
    <line x1="400" y1="500" x2="820" y2="290" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlowKiosk)"/>

    <!-- Right Back Wall with Wall Cap -->
    <polygon points="820,440 1260,650 1260,500 820,290" fill="#020617"/>
    <polygon points="820,290 1260,500 1248,506 808,296" fill="#0f172a"/>
    <line x1="820" y1="290" x2="1260" y2="500" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlowKiosk)"/>

    <!-- Windows in Back Wall at Night -->
    <polygon points="860,340 960,390 960,450 860,400" fill="#0369a1" opacity=".4"/>
    <polygon points="1000,410 1100,460 1100,520 1000,470" fill="#0369a1" opacity=".4"/>

    <!-- Entrance Portal Totem at Night -->
    <polygon points="390,650 490,600 490,440 390,490" fill="#0284c7" filter="url(#signGlowNight)"/>
    <polygon points="490,600 520,615 520,455 490,440" fill="#0369a1"/>
    <polygon points="390,490 490,440 520,455 420,505" fill="#38bdf8"/>

    <g transform="translate(405, 510) skewY(-26)">
      <polygon points="8,-8 18,-13 28,-8 28,8 18,13 8,8" fill="#ffffff" filter="url(#signGlowNight)"/>
      <circle cx="18" cy="2" r="3" fill="#0284c7"/>
      <text x="35" y="0" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="11" filter="url(#signGlowNight)">LAYANAN DESA DIGITAL</text>
      <text x="35" y="12" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="7">TERPADU &amp; MANDIRI</text>
    </g>

    <!-- Telecommunications Hub at Night -->
    <g transform="translate(820, 290)">
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#475569" stroke-width="5"/>
      <circle cx="0" cy="-90" r="7" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>
      <path d="M-22 -85 Q0 -105 22 -85" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#neonGlowKiosk)"/>
      <path d="M-34 -80 Q0 -115 34 -80" stroke="#0ea5e9" stroke-width="2" fill="none" opacity=".8"/>
    </g>

    <!-- Flagpole at Night -->
    <g transform="translate(1220, 680)">
      <line x1="0" y1="15" x2="0" y2="-150" stroke="#475569" stroke-width="4"/>
      <path d="M0 -145 Q25 -152 50 -142 Q40 -125 50 -115 Q25 -125 0 -115 Z" fill="#991b1b"/>
      <path d="M0 -115 Q25 -125 50 -115 Q40 -98 50 -88 Q25 -98 0 -88 Z" fill="#cbd5e1"/>
    </g>

    <!-- ====================================================================== -->
    <!-- SERVICE WINDOW COUNTERS AT NIGHT (Loket Terbuka Menyala Hangat)        -->
    <!-- ====================================================================== -->
    <!-- Loket 1 -->
    <g transform="translate(680, 520)">
      <polygon points="0,30 90,45 90,0 0,-15" fill="url(#interiorWarmNight)" opacity=".85"/>
      <polygon points="0,30 90,45 90,55 0,40" fill="#0284c7"/>
      <polygon points="0,-15 90,0 120,15 30,0" fill="#1e293b"/>
      <polygon points="40,-2 60,8 60,-12 40,-22" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>
      <polygon points="5,-40 85,-27 85,-10 5,-23" fill="#020617"/>
      <text x="10" y="-23" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="8.5" transform="skewY(9)">LOKET 1: KTP &amp; KK</text>
    </g>

    <!-- Loket 2 -->
    <g transform="translate(840, 600)">
      <polygon points="0,30 90,45 90,0 0,-15" fill="url(#interiorWarmNight)" opacity=".85"/>
      <polygon points="0,30 90,45 90,55 0,40" fill="#0284c7"/>
      <polygon points="0,-15 90,0 120,15 30,0" fill="#1e293b"/>
      <polygon points="40,-2 60,8 60,-12 40,-22" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>
      <polygon points="5,-40 85,-27 85,-10 5,-23" fill="#020617"/>
      <text x="10" y="-23" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="8.5" transform="skewY(9)">LOKET 2: SURAT &amp; IZIN</text>
    </g>

    <!-- Loket 3 -->
    <g transform="translate(1000, 680)">
      <polygon points="0,30 85,42 85,0 0,-15" fill="url(#interiorWarmNight)" opacity=".85"/>
      <polygon points="0,30 85,42 85,52 0,40" fill="#0284c7"/>
      <polygon points="0,-15 85,0 115,15 30,0" fill="#1e293b"/>
      <polygon points="35,-2 55,8 55,-12 35,-22" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>
      <polygon points="5,-40 80,-28 80,-10 5,-22" fill="#020617"/>
      <text x="8" y="-23" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="8" transform="skewY(9)">LOKET 3: BANSOS</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- RADIANT QUEUE MONITOR SCREEN AT NIGHT                                  -->
  <!-- ====================================================================== -->
  <g transform="translate(560, 520)">
    <line x1="45" y1="0" x2="45" y2="70" stroke="#0f172a" stroke-width="4"/>
    <polygon points="0,20 90,-25 90,45 0,90" fill="#020617"/>
    <polygon points="5,23 85,-20 85,40 5,83" fill="#0284c7" filter="url(#neonGlowKiosk)"/>

    <g transform="translate(12, 23) skewY(-26)">
      <rect x="0" y="-12" width="68" height="10" fill="#0369a1"/>
      <text x="5" y="-4" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="6">ANTREAN DIGITAL</text>
      <text x="5" y="14" fill="#fef08a" font-family="sans-serif" font-weight="900" font-size="18">A-024</text>
      <text x="5" y="27" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="8">MENUJU LOKET 1</text>
      <text x="5" y="38" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="6.5">B-012 • LOKET 2</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- GLOWING FORECOURT KIOSK: ANJUNGAN SURAT MANDIRI                        -->
  <!-- ====================================================================== -->
  <g transform="translate(480, 680)">
    <polygon points="28,25 40,33 40,105 15,92" fill="#1e293b"/>
    <polygon points="40,33 70,18 70,90 40,105" fill="#0f172a"/>

    <polygon points="37,47 52,56 78,40 63,30" fill="url(#touchScreenNight)" filter="url(#neonGlowKiosk)"/>
    <rect x="42" y="45" width="8" height="6" rx="1" fill="#ffffff"/>
    <rect x="54" y="40" width="8" height="6" rx="1" fill="#7dd3fc"/>
    <rect x="66" y="35" width="8" height="6" rx="1" fill="#fef08a"/>

    <ellipse cx="54" cy="74" rx="6" ry="4" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>

    <rect x="34" y="12" width="45" height="12" rx="2" fill="#0284c7" filter="url(#signGlowNight)"/>
    <text x="36" y="21" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="5.5">ANJUNGAN MANDIRI</text>
  </g>

  <!-- Mobile Service Van at Night with Lightbar -->
  <g transform="translate(1000, 770)">
    <circle cx="25" cy="45" r="14" fill="#020617"/>
    <circle cx="95" cy="45" r="14" fill="#020617"/>
    <path d="M10 40 L25 15 L70 15 L115 25 L115 45 Z" fill="#1e293b"/>
    <rect x="25" y="28" width="80" height="9" fill="#0369a1"/>
    <text x="28" y="35" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="6">LAYANAN KELILING DESA</text>
    <polygon points="12,38 -40,25 -40,55" fill="#bae6fd" opacity=".4" filter="url(#neonGlowKiosk)"/>
    <circle cx="53" cy="12" r="3" fill="#dc2626" filter="url(#neonGlowKiosk)"/>
    <circle cx="69" cy="12" r="3" fill="#38bdf8" filter="url(#neonGlowKiosk)"/>
  </g>
</svg>
